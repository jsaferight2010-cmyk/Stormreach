plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    // JEI (Just Enough Items): compile-only, for the optional JEI plugin. EMI and REI can load JEI plugins too.
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        stormreach {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        // Headless GameTest server: ./gradlew runGametest. Loads the whole datapack, runs every @GameTest in
        // com.stormreach.test, writes a JUnit report and exits non-zero if anything fails.
        gametest {
            server()
            name = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
            runDir 'build/gametest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Optional: only used for the Mod Menu config button. Not bundled, not required to play.
    clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    // Optional: the JEI plugin (client/compat/jei). Not bundled, not required to play.
    clientCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}") { transitive = false }

    // Unit tests for the pure-Java simulation code (tornado physics, EF scale, maze, hiding, boss plan, scripts).
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'stormreach.root', projectDir.absolutePath
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
