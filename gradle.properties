org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft 26.3 ships unobfuscated (Mojang names), so there is no mappings line and no remapping.
minecraft_version=26.3
loader_version=0.19.5
# Fabric Loom (no-remap plugin). Same version Fabric API's own 26.3 branch builds with.
loom_version=1.19.4

# Fabric API for 26.3: https://modrinth.com/mod/fabric-api/versions?g=26.3
fabric_api_version=0.161.0+26.3
# Mod Menu is compile-only (for the config button); it is optional at runtime.
modmenu_version=+

mod_version=5.4.0
maven_group=com.stormreach
archives_base_name=stormreach
